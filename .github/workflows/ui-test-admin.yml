name: Compte admin de test pour l'interface (TEST)

# Bouton manuel. Crée ou réinitialise admin-ui@afroeat.test dans la base de TEST, avec un mot de passe
# aléatoire chiffré par la clé publique fournie (rien n'est affiché en clair).
on:
  workflow_dispatch:
    inputs:
      public_key_b64:
        description: "Clé publique RSA (PEM encodée en base64)"
        required: true

permissions:
  contents: read

jobs:
  ui-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Vérifier que la base de test diffère de la vraie base
        env:
          TEST_MONGO_URI: ${{ secrets.TEST_MONGO_URI }}
          PLACES_MONGO_URI: ${{ secrets.PLACES_MONGO_URI }}
        run: |
          if [ -z "$TEST_MONGO_URI" ] || [ "$TEST_MONGO_URI" = "$PLACES_MONGO_URI" ]; then
            echo "::error::TEST_MONGO_URI absent ou identique à la vraie base : refusé."
            exit 1
          fi
      - name: Créer le compte admin de test
        env:
          AFROEAT_ENV: staging
          MONGO_URI: ${{ secrets.TEST_MONGO_URI }}
          UI_PUBLIC_KEY_B64: ${{ inputs.public_key_b64 }}
        run: node scripts/create-ui-admin.js
