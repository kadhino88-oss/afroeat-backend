name: Lire les menus publics des restaurants (journal seulement)

# Bouton manuel. Lit les pages publiques listées dans data/showcase/sites.js et affiche dans le journal les lignes
# qui contiennent un prix. N'écrit rien (ni base de données, ni fichier) et n'utilise aucun secret.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/fetch-public-menus.js
