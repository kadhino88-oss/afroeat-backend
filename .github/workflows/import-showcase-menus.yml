name: Importer les menus indicatifs (phase de test)

# Bouton manuel. Ajoute les menus indicatifs de data/showcase/menus.js aux fiches existantes SANS menu, les ferme et les
# marque « menu indicatif, non partenaire » (aucune commande possible). Ne supprime rien, ne crée aucune fiche.
# 1) Lancer d'abord SANS « apply » : simulation, rien n'est écrit.  2) Puis avec « apply » et confirm = afroeatDB.
# Secret requis : PLACES_MONGO_URI.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Écrire réellement (sinon : simulation)"
        type: boolean
        default: false
      confirm:
        description: "Pour apply : taper exactement afroeatDB"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: import-showcase-menus
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérifier la confirmation
        env:
          APPLY: ${{ inputs.apply }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$APPLY" = "true" ] && [ "$CONFIRM" != "afroeatDB" ]; then
            echo "::error::Pour écrire, tapez exactement afroeatDB dans « confirm »."
            exit 1
          fi
      - name: Importer (ou simuler)
        env:
          MONGO_URI: ${{ secrets.PLACES_MONGO_URI }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ -z "$MONGO_URI" ]; then
            echo "::error::Le secret PLACES_MONGO_URI est absent."
            exit 1
          fi
          node scripts/import-showcase-menus.js
