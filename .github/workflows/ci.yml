name: Backend CI

on:
  push:
    branches: [main, "security/**", "sync/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Run unit tests
        run: npm test
      - name: Verify installed dependency tree
        run: npm ls --depth=0
