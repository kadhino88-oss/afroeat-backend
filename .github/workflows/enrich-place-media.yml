name: Logos et images des commerces (sites web)

# Bouton manuel + chaque lundi : récupère l'image de partage et le logo publiés sur le site de chaque commerce.
# Secret requis : PLACES_MONGO_URI (la base officielle).
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Tout revérifier (sinon : seulement les sites jamais vus ou vus il y a plus de 30 jours)"
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Récupérer les visuels
        env:
          MONGO_URI: ${{ secrets.PLACES_MONGO_URI }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          LIMIT: '600'
        run: node scripts/enrich-place-media.js
