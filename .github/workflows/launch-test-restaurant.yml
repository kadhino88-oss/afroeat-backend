name: Restaurant d'essai pour tester un achat (base officielle)

# Bouton manuel (onglet « Actions » → « Run workflow »).
# create : crée « ESSAI D'ACHAT — À SUPPRIMER » avec un plat à 2,00 CHF. remove : le supprime.
# Secret requis : PLACES_MONGO_URI (la base officielle). Aucun mot de passe n'est créé ni affiché.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "create ou remove"
        type: choice
        options: [create, remove]
        default: create

permissions:
  contents: read

jobs:
  launch-test-restaurant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Créer ou retirer le restaurant d'essai
        env:
          MONGO_URI: ${{ secrets.PLACES_MONGO_URI }}
          ACTION: ${{ inputs.action }}
        run: node scripts/launch-test-restaurant.js
