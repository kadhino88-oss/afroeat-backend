name: Regenerate and validate backend security lockfile

on:
  push:
    branches: ["security/fix-minimatch-audit"]
    paths:
      - "package.json"
      - ".github/workflows/regenerate-security-lock.yml"

permissions:
  contents: write

jobs:
  regenerate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v7
        with:
          ref: security/fix-minimatch-audit
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from package overrides
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix(security): regenerate minimatch lockfile"
            git push origin HEAD:security/fix-minimatch-audit
          fi
      - name: Verify reproducible installation
        run: npm ci
      - name: Check syntax and tests
        run: |
          npm run check:syntax
          npm test
          npm ls --depth=0
      - name: Enforce dependency audit
        run: |
          npm audit --audit-level=moderate
          npm audit --omit=dev --audit-level=moderate
