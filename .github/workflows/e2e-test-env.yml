name: Test de bout en bout (environnement de TEST)

# Bouton manuel. Joue client, restaurant, livreur et admin contre l'API de TEST déployée
# (jamais la production) : devis, commande, paiement, préparation, livraison, invitation partenaire.
# Secrets requis : TEST_MONGO_URI et TEST_OWNER_PASSWORD (les mêmes que « Créer le restaurant TEST »).
# Aucun mot de passe ni jeton n'est affiché.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Vérifier les secrets (la base de test doit différer de la vraie base)
        env:
          TEST_MONGO_URI: ${{ secrets.TEST_MONGO_URI }}
          PLACES_MONGO_URI: ${{ secrets.PLACES_MONGO_URI }}
          TEST_OWNER_PASSWORD: ${{ secrets.TEST_OWNER_PASSWORD }}
        run: |
          if [ -z "$TEST_MONGO_URI" ] || [ -z "$TEST_OWNER_PASSWORD" ]; then
            echo "::error::Secrets TEST_MONGO_URI et TEST_OWNER_PASSWORD requis."
            exit 1
          fi
          if [ "$TEST_MONGO_URI" = "$PLACES_MONGO_URI" ]; then
            echo "::error::TEST_MONGO_URI est identique à la vraie base : refusé."
            exit 1
          fi
      - name: Préparer les comptes et le menu de test
        env:
          AFROEAT_ENV: staging
          MONGO_URI: ${{ secrets.TEST_MONGO_URI }}
          TEST_OWNER_PASSWORD: ${{ secrets.TEST_OWNER_PASSWORD }}
        run: node scripts/seed-test-restaurant.js
      - name: Parcours complet sur l'API de test
        env:
          TEST_OWNER_PASSWORD: ${{ secrets.TEST_OWNER_PASSWORD }}
        run: node scripts/e2e-test-env.js
