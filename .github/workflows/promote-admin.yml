name: Donner le rôle administrateur à un compte existant

# Bouton manuel, réservé aux personnes qui ont les droits d'écriture sur le dépôt.
# Cible la base de l'API officielle (secret PLACES_MONGO_URI, même base que l'API). Le mot de passe n'est pas modifié :
# le propriétaire du compte le définit ensuite avec « Mot de passe oublié ».
on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "Identifiant du compte à passer administrateur"
        required: true

permissions:
  contents: read

jobs:
  promote-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Passer le compte administrateur
        env:
          MONGO_URI: ${{ secrets.PLACES_MONGO_URI }}
          USER_ID: ${{ inputs.user_id }}
        run: |
          if [ -z "$MONGO_URI" ]; then
            echo "::error::Le secret PLACES_MONGO_URI est absent."
            exit 1
          fi
          node scripts/promote-admin.js
