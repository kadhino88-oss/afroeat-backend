name: Créer le restaurant TEST (base de test uniquement)

# Bouton manuel (onglet « Actions » → « Run workflow »).
# Crée un restaurant « TEST — Chez AfroEat (démo) » et 5 plats dans la base de TEST.
# Secrets requis : TEST_MONGO_URI (base de test, différente de la vraie) et TEST_OWNER_PASSWORD.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed-test-restaurant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Vérifier les secrets (la base de test doit différer de la vraie base)
        env:
          TEST_MONGO_URI: ${{ secrets.TEST_MONGO_URI }}
          PLACES_MONGO_URI: ${{ secrets.PLACES_MONGO_URI }}
          TEST_OWNER_PASSWORD: ${{ secrets.TEST_OWNER_PASSWORD }}
        run: |
          if [ -z "$TEST_MONGO_URI" ] || [ -z "$TEST_OWNER_PASSWORD" ]; then
            echo "::error::Secrets TEST_MONGO_URI et TEST_OWNER_PASSWORD requis."
            exit 1
          fi
          if [ "$TEST_MONGO_URI" = "$PLACES_MONGO_URI" ]; then
            echo "::error::TEST_MONGO_URI est identique à la vraie base : refusé."
            exit 1
          fi
      - name: Créer le restaurant et le menu de test
        env:
          AFROEAT_ENV: staging
          MONGO_URI: ${{ secrets.TEST_MONGO_URI }}
          TEST_OWNER_PASSWORD: ${{ secrets.TEST_OWNER_PASSWORD }}
        run: node scripts/seed-test-restaurant.js
