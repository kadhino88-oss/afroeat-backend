name: Surveillance de disponibilité

# Vérifie toutes les 15 minutes que le site, l'administration et l'API répondent.
# En cas de panne, ouvre (ou complète) une issue « Panne » : GitHub prévient le propriétaire par e-mail.
# Au retour à la normale, l'issue est commentée puis fermée automatiquement.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vérifier les services
        id: probe
        shell: bash
        run: |
          set +e
          failures=""
          probe() {
            local name="$1" url="$2" expect="$3"
            local code body
            for attempt in 1 2 3; do
              body=$(curl -s -m 25 -w '\n%{http_code}' "$url")
              code=$(echo "$body" | tail -n1)
              if [ "$code" = "200" ] && echo "$body" | grep -q "$expect"; then
                echo "OK   $name ($url)"
                return 0
              fi
              sleep 10
            done
            echo "KO   $name ($url) : HTTP $code"
            failures="${failures}- **${name}** : HTTP ${code} sur ${url}"$'\n'
          }
          probe "API" "https://afroeat-api-staging.vercel.app/health" '"success":true'
          probe "API (restaurants)" "https://afroeat-api-staging.vercel.app/api/restaurants" '"success"'
          probe "Site" "https://afroeat-app.vercel.app/" "<html"
          probe "Administration" "https://afroeat-admin.vercel.app/" "<html"
          {
            echo "failures<<EOF"
            printf '%s' "$failures"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Ouvrir ou fermer l'issue de panne
        uses: actions/github-script@v7
        env:
          FAILURES: ${{ steps.probe.outputs.failures }}
        with:
          script: |
            const title = 'Panne : un service AFROEAT ne répond plus';
            const failures = (process.env.FAILURES || '').trim();
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'panne', per_page: 5,
            });
            const current = open.find((i) => i.title === title);
            const now = new Date().toISOString().replace('T', ' ').slice(0, 16) + ' UTC';
            if (failures) {
              const body = `Constaté le ${now} (3 essais à 10 s d'intervalle) :\n\n${failures}\n\nJournal : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              if (current) {
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: current.number, body: `Toujours en panne.\n\n${body}` });
              } else {
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, labels: ['panne'], body });
              }
              core.setFailed('Service indisponible');
            } else if (current) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: current.number, body: `Tous les services répondent de nouveau (${now}).` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: current.number, state: 'closed' });
            }
